[project]
name = "customer-support-bot"
version = "0.1.0"
description = "AI Customer Support Automation using LangChain, Groq and Streamlit"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "streamlit",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false